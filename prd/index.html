<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AyuChat PRD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css"
    />
    <style>
      :root {
        --theme-color: #2563eb;
        --theme-color-dark: #1d4ed8;
      }

      .markdown-section {
        max-width: 960px;
      }

      .sidebar-nav > ul > li > p > strong {
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <div id="app">加载中…</div>
    <script>
      window.$docsify = {
        name: "AyuChat PRD",
        repo: "",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 4,
        auto2navbar: true,
        relativePath: true,
        mergeNavbar: true,
        notFoundPage: true,
        topMargin: 40,
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "搜索文档",
          noData: "未找到匹配内容",
          depth: 4,
        },
        copyCode: {
          buttonText: "复制",
          errorText: "复制失败",
          successText: "已复制",
        },
        pagination: {
          previousText: "上一页",
          nextText: "下一页",
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  </body>
</html>
